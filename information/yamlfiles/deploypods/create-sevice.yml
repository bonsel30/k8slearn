apiVersion: v1
kind: Service
metadata:
  name: nginxalpinenodeport
spec:
  type: NodePort
  selector:
    app: nginxalpine
  ports:
  - port: 4000
    targetPort: 80
    nodePort: 30081
    protocol: TCP

