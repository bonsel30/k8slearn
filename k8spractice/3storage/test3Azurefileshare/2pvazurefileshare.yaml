apiVersion: v1
kind: PersistentVolume
metadata:
  name: azfileshare1
spec:
  capacity:
    storage: 1Gi
  storageClassName: standard-rwx
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
      driver: file.csi.azure.com
      volumeHandle: "{k8slearnstorage}#{k8slearnstorage}#{test1}"  # make sure this volumeid is unique for every identical share in the cluster
      volumeAttributes:
        shareName: test1
      nodeStageSecretRef:
        name: azure-secret-account-key
        namespace: azstoragetest
  mountOptions:
    # Canonical permissions: 0755/uid=1000/gid=1000 for least privilege.
    # Use 0777/uid=0/gid=0 only if app requires root or broad write access.
    - dir_mode=0755
    - file_mode=0755
    - uid=1000
    - gid=1000
    - mfsymlinks
    - cache=strict
    - nosharesock
    - actimeo=30
    - nobrl

