apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-azure-file-pvc
spec:
  storageClassName: standard-rwx
  volumeName: azfileshare1
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---

apiVersion: v1
kind: Pod
metadata:
  name: web-server
spec:
  containers:
   - name: web-server
     image: nginx
     volumeMounts:
       - mountPath: /var/lib/www/html
         name: data
  volumes:
   - name: data
     persistentVolumeClaim:
       claimName: my-azure-file-pvc