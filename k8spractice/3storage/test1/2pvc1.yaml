apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc1
spec:
  storageClassName: ""  # This disables dynamic provisioning
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

