apiVersion: v1
kind: PersistentVolume
metadata:
  name: azfileshare1
spec:
  capacity:
    storage: 1Gi
  storageClassName: standard-rwx
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: file.csi.azure.com
    readOnly: false
    volumeHandle: k8slearnstorage#k8slearnjbo#test1
    nodeStageSecretRef:
      name: azure-secret-account-key
      namespace: azstoragetest